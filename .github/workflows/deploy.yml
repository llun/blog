name: Deploy

on:
  push:
    branches:
      - master

concurrency:
  group: production-deploy
  cancel-in-progress: false

# Read-only by default; only the AWS jobs add id-token, for the OIDC role.
permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Enable corepack
        run: corepack enable

      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Restore resized images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          # scripts/optimize-images.ts re-encodes only images whose hash
          # changed, so a restored cache keeps the build fast
          path: |
            public/_img
            .cache/image-manifest.json
          key: images-${{ hashFiles('scripts/optimize-images.ts', 'libs/images.ts', 'public/posts/**', 'public/tags/**/*.png', 'public/tags/**/*.jpg', 'public/img/**') }}
          restore-keys: images-

      - name: Build site
        run: yarn export
        env:
          NEXT_PUBLIC_MAPBOX_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_MAPBOX_PUBLIC_KEY }}

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-build-${{ github.sha }}
          path: out/

  upload-s3:
    name: Upload to S3
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-build-${{ github.sha }}
          path: out/

      # Signs in as the BlogGitHubDeploy role through GitHub OIDC (no stored AWS keys).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-1

      - name: Upload to S3 (parallel)
        env:
          HTML_CACHE_CONTROL: 'public, max-age=0, s-maxage=86400, stale-while-revalidate=604800'
        run: |
          echo "🚀 Starting parallel S3 uploads..."

          # HTML and other text assets: CloudFront keeps them for a day
          # (s-maxage) and serves a stale copy while it refetches, so visitors
          # never wait on S3. Every deploy invalidates /*, so a new post still
          # shows at once. Browsers revalidate each time (max-age=0) and get
          # a 304 from the edge.
          echo "📄 [1/4] Uploading HTML and text assets..."
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --acl public-read \
            --cache-control "$HTML_CACHE_CONTROL" \
            --follow-symlinks \
            --exclude '*.jpg' \
            --exclude '*.jpeg' \
            --exclude '*.png' \
            --exclude '*.webp' \
            --exclude '*.avif' \
            --exclude '*.ico' \
            --exclude '_next/static/*' \
            --exclude 'feeds/main' \
            --exclude 'feeds/atom.xml' &
          PID1=$!

          # Content-hashed bundles - the filename changes whenever the bytes do,
          # so these can be cached permanently
          echo "📦 [2/4] Uploading hashed build output with immutable cache..."
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --acl public-read \
            --cache-control 'public, max-age=31536000, immutable' \
            --follow-symlinks \
            --exclude '*' \
            --include '_next/static/*' &
          PID4=$!

          # Images with long cache (7 days) - these rarely change
          echo "🖼️  [3/4] Uploading images with 7-day cache..."
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --acl public-read \
            --cache-control max-age=604800 \
            --follow-symlinks \
            --exclude '*' \
            --include '*.jpg' \
            --include '*.jpeg' \
            --include '*.png' \
            --include '*.webp' \
            --include '*.avif' \
            --include '*.ico' &
          PID2=$!

          # Atom feeds with proper content-type for feed readers
          echo "📡 [4/4] Uploading Atom feeds..."
          aws s3 sync out/ s3://${{ secrets.AWS_S3_BUCKET }}/ \
            --acl public-read \
            --follow-symlinks \
            --exclude '*' \
            --include 'feeds/main' \
            --include 'feeds/atom.xml' \
            --cache-control "$HTML_CACHE_CONTROL" \
            --content-type 'application/atom+xml' &
          PID3=$!

          # Wait for all uploads to complete
          echo "⏳ Waiting for all uploads to complete..."
          wait $PID1 && echo "✅ [1/4] Text assets uploaded" || { echo "❌ [1/4] Text assets failed"; exit 1; }
          wait $PID4 && echo "✅ [2/4] Hashed build output uploaded" || { echo "❌ [2/4] Hashed build output failed"; exit 1; }
          wait $PID2 && echo "✅ [3/4] Images uploaded" || { echo "❌ [3/4] Images failed"; exit 1; }
          wait $PID3 && echo "✅ [4/4] Feeds uploaded" || { echo "❌ [4/4] Feeds failed"; exit 1; }
          echo "🎉 All S3 uploads completed successfully!"

      - name: Remove retired RSS feed
        run: |
          # RSS was retired in favour of Atom. The syncs above deliberately run
          # without --delete, so this object would otherwise keep serving a
          # frozen copy of the feed forever instead of 404ing.
          aws s3 rm s3://${{ secrets.AWS_S3_BUCKET }}/feeds/rss.xml || true

      - name: Remove retired journeys
        run: |
          # The journeys section (Wordle, Amsterdam, AirTag and Lasik) was
          # removed from the site. The syncs above run without --delete, so
          # its exported pages and photos would otherwise keep serving.
          aws s3 rm s3://${{ secrets.AWS_S3_BUCKET }}/journeys/ --recursive || true

  invalidate-cdn:
    name: Invalidate CloudFront
    runs-on: ubuntu-latest
    needs: upload-s3
    permissions:
      contents: read
      id-token: write
    steps:
      # Signs in as the BlogGitHubDeploy role through GitHub OIDC (no stored AWS keys).
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Invalidate CloudFront cache
        run: |
          echo "🔄 Invalidating CloudFront distribution..."
          aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.AWS_DISTRIBUTION_ID }} \
            --paths "/*"
          echo "✅ CloudFront invalidation created!"

      - name: Check edge caching
        run: |
          # Reports what the edge sends for the home page; a cache policy that
          # ignores the origin's Cache-Control shows up here as a miss on the
          # second request
          for attempt in 1 2; do
            curl -s -o /dev/null --compressed \
              -w "attempt $attempt: %{http_code} ttfb=%{time_starttransfer}s\n" \
              https://www.llun.me/
          done
          curl -sI --compressed https://www.llun.me/ \
            | grep -iE '^(cache-control|x-cache|age|content-encoding):' || true
