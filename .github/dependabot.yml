# Opens a PR when a workflow action has a new major tag. Action updates are reviewed by hand:
# dependabot-automerge.yml only auto-merges npm security updates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 8
    groups:
      actions:
        patterns:
          - '*'
